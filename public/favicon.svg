<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2b1e"/>
      <stop offset="100%" stop-color="#081017"/>
    </radialGradient>

    <linearGradient id="armyShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667A45"/>
      <stop offset="50%" stop-color="#3F5135"/>
      <stop offset="100%" stop-color="#182026"/>
    </linearGradient>

    <linearGradient id="goldEagleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="40%" stop-color="#D6A23A"/>
      <stop offset="100%" stop-color="#8A5C10"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background Circle with Subtle Border -->
  <circle cx="256" cy="256" r="240" fill="url(#bgRadial)" stroke="#3F5135" stroke-width="4"/>

  <!-- Outer Wreath / Circle Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldEagleGrad)" stroke-width="3" stroke-dasharray="14 6"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(214, 162, 58, 0.3)" stroke-width="1.5"/>

  <!-- Outer Shield Crest -->
  <path d="M 256 70 
           C 345 70, 405 90, 425 135 
           C 425 280, 355 400, 256 455 
           C 157 400, 87 280, 87 135 
           C 107 90, 167 70, 256 70 Z" 
        fill="url(#armyShieldGrad)" 
        stroke="url(#goldEagleGrad)" 
        stroke-width="7" 
        filter="url(#goldGlow)"/>

  <!-- Inner Shield Accent Line -->
  <path d="M 256 94 
           C 330 94, 380 112, 396 150 
           C 396 268, 338 372, 256 422 
           C 174 372, 116 268, 116 150 
           C 132 112, 182 94, 256 94 Z" 
        fill="none" 
        stroke="rgba(242, 244, 239, 0.4)" 
        stroke-width="2" 
        stroke-dasharray="10 5"/>

  <!-- GOLDEN EAGLE EMBLEM (Spread Wings + Crest) -->
  <g transform="translate(256, 235)">
    <!-- Head & Crown -->
    <path d="M 0 -75 L 10 -55 L 24 -62 L 15 -42 L 32 -44 L 20 -28 Z" fill="url(#goldEagleGrad)"/>
    <path d="M 0 -75 C -12 -65, -18 -50, -10 -35 L 0 -45 L 10 -35 C 18 -50, 12 -65, 0 -75 Z" fill="#FFF099"/>

    <!-- Left Spread Wing -->
    <path d="M -10 -40 C -70 -65, -145 -55, -165 -15 C -135 0, -95 -10, -50 -15 C -90 10, -130 35, -145 70 C -115 50, -75 30, -35 15 C -65 40, -95 75, -105 110 C -75 80, -40 55, -15 35 Z" 
          fill="url(#goldEagleGrad)" stroke="#8A5C10" stroke-width="1.5"/>

    <!-- Right Spread Wing -->
    <path d="M 10 -40 C 70 -65, 145 -55, 165 -15 C 135 0, 95 -10, 50 -15 C 90 10, 130 35, 145 70 C 115 50, 75 30, 35 15 C 65 40, 95 75, 105 110 C 75 80, 40 55, 15 35 Z" 
          fill="url(#goldEagleGrad)" stroke="#8A5C10" stroke-width="1.5"/>

    <!-- Center Breast Shield & Star -->
    <path d="M 0 -25 L 35 0 C 35 35, 20 65, 0 85 C -20 65, -35 35, -35 0 Z" 
          fill="#182026" stroke="url(#goldEagleGrad)" stroke-width="3"/>
    
    <!-- 5-Pointed Star -->
    <polygon points="0,-16 5,-4 17,-4 7,3 11,15 0,8 -11,15 -7,3 -17,-4 -5,-4" fill="url(#goldEagleGrad)"/>

    <!-- Tail Feathers -->
    <path d="M -25 80 L -35 130 L 0 115 L 35 130 L 25 80 Z" fill="url(#goldEagleGrad)"/>
  </g>

  <!-- Stars Accent Row -->
  <g transform="translate(256, 385)">
    <polygon points="-50,0 -46,6 -39,6 -44,10 -42,16 -50,12 -58,16 -56,10 -61,6 -54,6" fill="#D6A23A"/>
    <polygon points="0,-4 5,3 13,3 7,8 9,15 0,11 -9,15 -7,8 -13,3 -5,3" fill="#FFF099"/>
    <polygon points="50,0 54,6 61,6 56,10 58,16 50,12 42,16 44,10 39,6 46,6" fill="#D6A23A"/>
  </g>
</svg>
